name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and package proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run runtime:check
      - run: npm run build
      - run: test -f dist/codex-jsonl-proxy.mjs && test -x dist/codex-jsonl-proxy.mjs
      - run: npm pack --json > package-info.json
      - run: node -e "const fs=require('fs');const info=JSON.parse(fs.readFileSync('package-info.json'))[0];if(!info.files.some(file=>file.path==='dist/codex-jsonl-proxy.mjs'&&(file.mode&73)))process.exit(1)"
  type-check:
    name: TypeScript type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check
      - run: npm run type-check:mention-tests
      - run: npm run type-check:recovery-tests
      - run: npm run type-check:continuity-tests
      - name: Type-check canonical options test contract
        run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --skipLibCheck --esModuleInterop src/__tests__/agent-bridge-events.test.ts
      - name: Type-check card telemetry tests
        run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --noUnusedLocals --noUnusedParameters --skipLibCheck --esModuleInterop src/__tests__/cards-telemetry-*.test.ts
      - name: Type-check card pacer and write-queue tests
        run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --noUnusedLocals --noUnusedParameters --skipLibCheck --esModuleInterop src/__tests__/cards-pacer*.test.ts src/__tests__/cards-write-queue*.test.ts

  lint:
    name: ESLint (zero warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    name: Vitest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24.10.0']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - name: Repeat Unix launcher contracts
        timeout-minutes: 10
        run: |
          for attempt in $(seq 1 20); do
            echo "Launcher attempt ${attempt}/20"
            start=$SECONDS
            set +e
            timeout --signal=KILL 30s npm run test -- src/__tests__/sdk-jsonl.test.ts src/__tests__/jsonl-proxy-path.test.ts --maxWorkers=1 --minWorkers=1
            status=$?
            set -e
            echo "Launcher attempt ${attempt}/20 exit=${status} duration=$((SECONDS-start))s"
            if [ "$status" -ne 0 ]; then exit "$status"; fi
          done
      - run: npm test

  latest-sdk:
    name: Latest stable SDK (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24.10.0']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      # Explicit refresh bypasses the committed lock's runtime pin, without
      # overriding the CLI selected by the SDK itself.
      - run: npm run runtime:update
      - run: npm run type-check
      - run: npm run type-check:mention-tests
      - run: npm run type-check:recovery-tests
      - run: npm run type-check:continuity-tests
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
