name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and package proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # The pinned-main default-configuration comparison needs its commit.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run runtime:check
      - run: npm run build
      - run: python3 -m unittest discover -s scripts -p test_profile_test.py
      - run: node scripts/check_profile_compat.mjs
      - run: test -f dist/codex-jsonl-proxy.mjs && test -x dist/codex-jsonl-proxy.mjs
      - run: npm pack --json > package-info.json
      - run: node -e "const fs=require('fs');const info=JSON.parse(fs.readFileSync('package-info.json'))[0];if(!info.files.some(file=>file.path==='dist/codex-jsonl-proxy.mjs'&&(file.mode&73)))process.exit(1)"
  type-check:
    name: TypeScript type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check
      - run: npm run type-check:mention-tests
      - run: npm run type-check:recovery-tests
      - run: npm run type-check:continuity-tests

  lint:
    name: ESLint (zero warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    name: Vitest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24.10.0']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - name: Verify launcher supervisor failure paths
        timeout-minutes: 5
        run: python3 scripts/ci/test_repeat_launcher.py
      - name: Repeat Linux launcher contracts (serial)
        # 20 × (90s run + 15s TERM grace + 3s KILL/reap + 1s wait + 2s natural settle) = 2220s; 180s slack.
        timeout-minutes: 40
        run: python3 scripts/ci/repeat-launcher.py --attempts 20 -- node node_modules/vitest/vitest.mjs run src/__tests__/sdk-jsonl.test.ts src/__tests__/jsonl-proxy-path.test.ts --maxWorkers=1 --minWorkers=1 --reporter=verbose
      - run: npm test

  latest-sdk:
    name: Latest stable SDK (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24.10.0']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      # Explicit refresh bypasses the committed lock's runtime pin, without
      # overriding the CLI selected by the SDK itself.
      - run: npm run runtime:update
      - run: npm run type-check
      - run: npm run type-check:mention-tests
      - run: npm run type-check:recovery-tests
      - run: npm run type-check:continuity-tests
      - run: npm run lint
      - run: npm run build
      - name: Repeat updated SDK launcher contracts (default concurrency)
        # 5 × 111s = 555s; 105s slack for startup and reporting.
        timeout-minutes: 11
        run: python3 scripts/ci/repeat-launcher.py --attempts 5 -- node node_modules/vitest/vitest.mjs run src/__tests__/sdk-jsonl.test.ts src/__tests__/jsonl-proxy-path.test.ts --reporter=verbose
      - run: npm test
      - run: npm pack --dry-run
