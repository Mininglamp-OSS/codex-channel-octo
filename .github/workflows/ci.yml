name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and package proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # The pinned-main default-configuration comparison needs its commit.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run runtime:check
      - run: npm run build
      - run: python3 -m unittest discover -s scripts -p test_profile_test.py
      - run: node scripts/check_profile_compat.mjs
      - name: Verify pinned PSL in package
        run: |
          npm pack --json > psl-package-info.json
          node --input-type=module -e "import fs from 'node:fs'; import crypto from 'node:crypto'; const sha='2919eb9803c91a3f73a507cc6fedc934de005543c22c4016f72e3343de5dd6e7'; const path='dist/cards/data/psl-'+sha+'.dat'; const info=JSON.parse(fs.readFileSync('psl-package-info.json'))[0]; if(crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex')!==sha || !info.files.some(f=>f.path===path) || info.files.some(f=>/__tests__|__fixtures__|privacy-corpus|harness/.test(f.path))) process.exit(1); for(const name of ['LICENSE-PSL.txt','NOTICE.txt','PSL-PROVENANCE.json']) if(!info.files.some(f=>f.path==='dist/cards/data/'+name)) process.exit(1)"
      - run: test -f dist/codex-jsonl-proxy.mjs && test -x dist/codex-jsonl-proxy.mjs
      - run: npm pack --json > package-info.json
      - run: node -e "const fs=require('fs');const info=JSON.parse(fs.readFileSync('package-info.json'))[0];if(!info.files.some(file=>file.path==='dist/codex-jsonl-proxy.mjs'&&(file.mode&73)))process.exit(1)"
  type-check:
    name: TypeScript type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check
      - run: npm run type-check:mention-tests
      - run: npm run type-check:recovery-tests
      - run: npm run type-check:continuity-tests
      - name: Type-check WP-05 corpus and notice contracts
        run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --skipLibCheck --esModuleInterop --resolveJsonModule src/__tests__/cards-redact.test.ts src/__tests__/cards-redact-regressions.test.ts src/__tests__/cards-redact-idna.test.ts src/__tests__/cards-notices.test.ts src/__tests__/cards-safe-bridge.test.ts
      - name: Type-check canonical options test contract
        run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --skipLibCheck --esModuleInterop src/__tests__/agent-bridge-events.test.ts
      - name: Type-check card telemetry tests
        run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --noUnusedLocals --noUnusedParameters --skipLibCheck --esModuleInterop src/__tests__/cards-telemetry-*.test.ts
      - name: Type-check card pacer and write-queue tests
        run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --noUnusedLocals --noUnusedParameters --skipLibCheck --esModuleInterop src/__tests__/cards-pacer*.test.ts src/__tests__/cards-write-queue*.test.ts

  lint:
    name: ESLint (zero warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    name: Vitest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24.10.0']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - name: Probe the launcher attempt supervisor
        run: python3 -m unittest discover -s scripts -p supervise_attempt_test.py -v
      - name: Repeat Unix launcher contracts
        # 20 attempts of at most 30 s each, plus at most 10 s TERM grace and 5 s
        # reaping per attempt for its teardown: 20 x 45 s = 15 min.
        timeout-minutes: 15
        run: |
          for attempt in $(seq 1 20); do
            echo "Launcher attempt ${attempt}/20"
            start=$SECONDS
            set +e
            scripts/supervise-attempt.sh 30 10 -- npm run test -- src/__tests__/sdk-jsonl.test.ts src/__tests__/jsonl-proxy-path.test.ts --maxWorkers=1 --minWorkers=1
            status=$?
            set -e
            echo "Launcher attempt ${attempt}/20 exit=${status} duration=$((SECONDS-start))s"
            if [ "$status" -ne 0 ]; then exit "$status"; fi
          done
      - run: npm test

  latest-sdk:
    name: Latest stable SDK (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24.10.0']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      # Explicit refresh bypasses the committed lock's runtime pin, without
      # overriding the CLI selected by the SDK itself.
      - run: npm run runtime:update
      - run: npm run type-check
      - run: npm run type-check:mention-tests
      - run: npm run type-check:recovery-tests
      - run: npm run type-check:continuity-tests
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
